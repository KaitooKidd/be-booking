version: "3"
networks:
  app-tier:
    driver: bridge

services:
  mysql:
    image: mysql:latest
    restart: always
    environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: booking
        MYSQL_USER: root
        MYSQL_PASSWORD: root
    ports:
        - "3306:3306"
    volumes:
        - mysql:/var/lib/mysql

  zookeeper:
    image: 'bitnami/zookeeper:latest'
    restart: always
    networks:
      - app-tier
    ports:
      - '2181:2181'
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka:
    image: 'bitnami/kafka:latest'
    restart: always
    networks:
      - app-tier
    ports:
      - '9094:9094'
      - '9092:9092'
    environment:
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_LISTENERS=CLIENT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=CLIENT://kafka:9092,EXTERNAL://192.168.99.163:9094
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=CLIENT
      - KAFKA_CFG_LOG_RETENTION_HOURS=96
      - KAFKA_CFG_LOG_RETENTION_CHECK_INTERVAL_MS=10000
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper

  kafdrop:
    image: 'obsidiandynamics/kafdrop'
    restart: always
    networks:
      - app-tier
    ports:
      - '9100:9000'
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      JVM_OPTS: "-Xms16M -Xmx48M -Xss512K -XX:-TieredCompilation -XX:+UseStringDeduplication"
    depends_on:
      - kafka

volumes:
  mysql:
